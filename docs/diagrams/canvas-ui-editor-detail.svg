<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Canvas UI Editor Detail</title>
  <desc id="desc">A layout mockup of the canvas editor showing the top toolbar, side rail, panels, canvas stage, and selection-driven properties state.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="toolbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#151b2c"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="canvas" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbfdff"/>
      <stop offset="100%" stop-color="#f3f6fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#dfe6f0" stroke-width="1" opacity="0.8"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1420" cy="160" r="220" fill="#f59e0b" opacity="0.06"/>
  <circle cx="260" cy="860" r="260" fill="#38bdf8" opacity="0.07"/>

  <g filter="url(#shadow)">
    <rect x="54" y="42" width="1492" height="916" rx="24" fill="#0f172a" stroke="#2b3447"/>

    <rect x="54" y="42" width="1492" height="74" rx="24" fill="url(#toolbar)"/>
    <rect x="54" y="96" width="1492" height="20" fill="url(#toolbar)"/>

    <rect x="54" y="116" width="64" height="842" fill="#111827" stroke="#253044"/>
    <rect x="118" y="116" width="332" height="842" fill="#141b2a" stroke="#253044"/>
    <rect x="450" y="116" width="920" height="842" fill="#182132" stroke="#253044"/>
    <rect x="1370" y="116" width="176" height="842" fill="#141b2a" stroke="#253044"/>

    <rect x="476" y="146" width="874" height="784" rx="18" fill="url(#canvas)" stroke="#d6deea"/>
    <rect x="500" y="170" width="826" height="736" rx="14" fill="url(#grid)"/>

    <rect x="744" y="320" width="366" height="194" rx="18" fill="#ffffff" stroke="#b7c3d3" stroke-width="2"/>
    <rect x="780" y="354" width="146" height="18" rx="9" fill="#e2e8f0"/>
    <rect x="780" y="388" width="252" height="18" rx="9" fill="#cbd5e1"/>
    <rect x="780" y="420" width="204" height="18" rx="9" fill="#e2e8f0"/>
    <rect x="780" y="452" width="182" height="18" rx="9" fill="#e2e8f0"/>

    <circle cx="744" cy="320" r="7" fill="#2563eb"/>
    <circle cx="1110" cy="320" r="7" fill="#2563eb"/>
    <circle cx="744" cy="514" r="7" fill="#2563eb"/>
    <circle cx="1110" cy="514" r="7" fill="#2563eb"/>

    <rect x="150" y="150" width="286" height="42" rx="12" fill="#20283a"/>
    <rect x="150" y="202" width="286" height="42" rx="12" fill="#20283a"/>
    <rect x="150" y="254" width="286" height="42" rx="12" fill="#20283a"/>
    <rect x="150" y="306" width="286" height="42" rx="12" fill="#20283a"/>
    <rect x="150" y="358" width="286" height="42" rx="12" fill="#20283a"/>
    <rect x="150" y="410" width="286" height="42" rx="12" fill="#20283a"/>
    <rect x="150" y="462" width="286" height="42" rx="12" fill="#20283a"/>
    <rect x="150" y="514" width="286" height="42" rx="12" fill="#20283a"/>

    <rect x="1390" y="154" width="136" height="28" rx="8" fill="#223047"/>
    <rect x="1390" y="196" width="136" height="28" rx="8" fill="#223047"/>
    <rect x="1390" y="238" width="136" height="28" rx="8" fill="#223047"/>
    <rect x="1390" y="280" width="136" height="28" rx="8" fill="#223047"/>
    <rect x="1390" y="322" width="136" height="28" rx="8" fill="#223047"/>
    <rect x="1390" y="364" width="136" height="28" rx="8" fill="#223047"/>
  </g>

  <g fill="#eef2ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">
    <text x="86" y="86">Editor layout</text>
    <text x="236" y="86">Workspace structure</text>
    <text x="150" y="178">Templates</text>
    <text x="150" y="230">Elements</text>
    <text x="150" y="282">Text</text>
    <text x="150" y="334">Uploads</text>
    <text x="150" y="386">Photos</text>
    <text x="150" y="438">AI</text>
    <text x="150" y="490">Brand</text>
    <text x="150" y="542">Layers</text>
    <text x="1392" y="170">Fill</text>
    <text x="1392" y="212">Stroke</text>
    <text x="1392" y="254">Font</text>
    <text x="1392" y="296">Position</text>
    <text x="1392" y="338">Effects</text>
    <text x="1392" y="380">Arrange</text>
  </g>

  <g fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">
    <text x="500" y="144">Canvas stage</text>
    <text x="762" y="312">Selected object state</text>
    <text x="1392" y="454">Right properties panel</text>
    <text x="90" y="620">Left navigation rail</text>
    <text x="170" y="620">Template and asset browsing</text>
    <text x="520" y="910">Main working surface with drag-and-drop editing and object selection</text>
  </g>

  <g>
    <rect x="834" y="60" width="106" height="28" rx="14" fill="#1f2937" stroke="#4b5563"/>
    <circle cx="858" cy="74" r="9" fill="#f59e0b"/>
    <text x="877" y="79" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Snap</text>

    <rect x="1088" y="60" width="120" height="28" rx="14" fill="#1f2937" stroke="#334155"/>
    <text x="1110" y="79" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">Save</text>

    <rect x="478" y="118" width="860" height="26" rx="12" fill="#e2e8f0" opacity="0.75"/>
  </g>
</svg>
