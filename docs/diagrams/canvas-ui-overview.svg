<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Canvas UI Overview</title>
  <desc id="desc">A styled mockup of the editor layout showing the top toolbar, left rail, canvas stage, properties panel, and optional AI panel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="toolbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#171b2a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="canvas" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c2233"/>
      <stop offset="100%" stop-color="#121826"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#d9e2ef" stroke-width="1" opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1450" cy="130" r="220" fill="#f59e0b" opacity="0.08"/>
  <circle cx="250" cy="860" r="260" fill="#38bdf8" opacity="0.08"/>

  <g filter="url(#shadow)">
    <rect x="60" y="42" width="1480" height="916" rx="22" fill="#0f172a" stroke="#2b3447" stroke-width="1"/>

    <rect x="60" y="42" width="1480" height="72" rx="22" fill="url(#toolbar)"/>
    <rect x="60" y="94" width="1480" height="20" fill="url(#toolbar)"/>

    <rect x="60" y="114" width="62" height="844" fill="#111827" stroke="#263043"/>
    <rect x="122" y="114" width="330" height="844" fill="#141b2a" stroke="#263043"/>

    <rect x="452" y="114" width="900" height="844" fill="#182132" stroke="#263043"/>
    <rect x="1352" y="114" width="188" height="844" fill="#141b2a" stroke="#263043"/>

    <rect x="454" y="118" width="896" height="828" rx="16" fill="url(#canvas)" stroke="#d4dbe6"/>
    <rect x="484" y="148" width="836" height="760" rx="14" fill="url(#grid)" opacity="0.9"/>

    <rect x="695" y="278" width="412" height="184" rx="18" fill="#ffffff" stroke="#b8c3d6" stroke-width="2"/>
    <rect x="736" y="312" width="148" height="22" rx="11" fill="#e2e8f0"/>
    <rect x="736" y="350" width="300" height="18" rx="9" fill="#cbd5e1"/>
    <rect x="736" y="380" width="260" height="18" rx="9" fill="#e2e8f0"/>

    <rect x="171" y="140" width="236" height="40" rx="12" fill="#20283a"/>
    <rect x="171" y="196" width="236" height="40" rx="12" fill="#20283a"/>
    <rect x="171" y="252" width="236" height="40" rx="12" fill="#20283a"/>
    <rect x="171" y="308" width="236" height="40" rx="12" fill="#20283a"/>
    <rect x="171" y="364" width="236" height="40" rx="12" fill="#20283a"/>
    <rect x="171" y="420" width="236" height="40" rx="12" fill="#20283a"/>
    <rect x="171" y="476" width="236" height="40" rx="12" fill="#20283a"/>

    <rect x="1370" y="148" width="150" height="26" rx="8" fill="#223047"/>
    <rect x="1370" y="190" width="150" height="26" rx="8" fill="#223047"/>
    <rect x="1370" y="232" width="150" height="26" rx="8" fill="#223047"/>
    <rect x="1370" y="274" width="150" height="26" rx="8" fill="#223047"/>
    <rect x="1370" y="316" width="150" height="26" rx="8" fill="#223047"/>
    <rect x="1370" y="358" width="150" height="26" rx="8" fill="#223047"/>
  </g>

  <g fill="#eef2ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">
    <text x="92" y="84">Top toolbar</text>
    <text x="236" y="82">Canvas editor</text>
    <text x="176" y="170">Templates</text>
    <text x="176" y="226">Elements</text>
    <text x="176" y="282">Text</text>
    <text x="176" y="338">Uploads</text>
    <text x="176" y="394">Photos</text>
    <text x="176" y="450">AI</text>
    <text x="176" y="506">Layers</text>
    <text x="1372" y="140">Properties</text>
    <text x="1372" y="182">Fill</text>
    <text x="1372" y="224">Stroke</text>
    <text x="1372" y="266">Font</text>
    <text x="1372" y="308">Position</text>
    <text x="1372" y="350">Effects</text>
    <text x="1372" y="392">Arrange</text>
  </g>

  <g fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">
    <text x="484" y="146">Canvas stage with object selection, drag and drop, and optional grid snapping</text>
    <text x="715" y="404">Selected canvas object</text>
    <text x="171" y="560">Left navigation rail</text>
    <text x="1370" y="452">Right properties panel</text>
    <text x="384" y="84">Undo | Redo | Zoom | Snap | Save</text>
    <text x="1172" y="84">Share | Portal | Export</text>
  </g>

  <g>
    <rect x="840" y="58" width="92" height="28" rx="14" fill="#1f2937" stroke="#4b5563"/>
    <circle cx="866" cy="72" r="9" fill="#f59e0b"/>
    <text x="883" y="77" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">Snap</text>

    <rect x="742" y="120" width="152" height="18" rx="9" fill="#e2e8f0" opacity="0.85"/>
    <rect x="742" y="880" width="152" height="18" rx="9" fill="#e2e8f0" opacity="0.85"/>
  </g>
</svg>
