<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1400" width="1440" height="1400" role="img" aria-labelledby="lp-title lp-desc">
  <title id="lp-title">ManuScript Studio – Landing Page Layout</title>
  <desc id="lp-desc">Wireframe of the unauthenticated LandingPage: sticky header, 2-column hero, features 3-column grid, how-it-works 3-step section, CTA, and footer.</desc>

  <!-- Background -->
  <rect width="1440" height="1400" fill="#0d0e12"/>
  <text x="720" y="18" font-family="'Courier New', monospace" font-size="11" fill="#c4935c" text-anchor="middle" font-weight="700">MANUSCRIPT STUDIO — LANDING PAGE  (1440 × 1400px wireframe)  · unauthenticated</text>

  <!-- ─── STICKY HEADER  h=64 ─── -->
  <rect x="0" y="24" width="1440" height="64" fill="#111318" fill-opacity="0.96"/>
  <rect x="0" y="87" width="1440" height="1" fill="#2a2d38"/>
  <rect x="0" y="24" width="1440" height="2" fill="#c4935c" opacity="0.5"/>
  <text x="720" y="21" font-family="'Courier New', monospace" font-size="7.5" fill="#c4935c" text-anchor="middle">STICKY HEADER  h=64px  bg=#111318 + backdrop-blur  position:sticky top:0  z-index:50</text>

  <!-- Logo left -->
  <rect x="24" y="36" width="32" height="32" rx="7" fill="#1a1d23" stroke="#2a2d38"/>
  <rect x="30" y="42" width="20" height="20" rx="3" fill="none" stroke="#c4935c" stroke-width="1.5"/>
  <path d="M34 47 l5 5 l5 -5" fill="none" stroke="#c4935c" stroke-width="1.5"/>
  <text x="64" y="52" font-family="'Inter', system-ui, sans-serif" font-size="10" fill="#e2e3e8" font-weight="700" letter-spacing="1.5">MANUSCRIPT</text>
  <text x="64" y="65" font-family="'Inter', system-ui, sans-serif" font-size="8" fill="#9ca3af" letter-spacing="3">STUDIO</text>

  <!-- Get Started action chip right -->
  <rect x="1292" y="38" width="120" height="32" rx="16" fill="#c4935c"/>
  <text x="1352" y="58" font-family="'Inter', system-ui, sans-serif" font-size="12" fill="#111318" text-anchor="middle" font-weight="700">Get Started →</text>

  <!-- ─── HERO SECTION  y=88 → y=600 ─── -->
  <rect x="0" y="88" width="1440" height="512" fill="#0d0e12"/>
  <text x="720" y="98" font-family="'Courier New', monospace" font-size="8" fill="#c4935c" text-anchor="middle">HERO SECTION  h=512px  2-column layout  (text left / canvas preview right)</text>

  <!-- Left col (text) — 660px wide -->
  <!-- badge -->
  <rect x="80" y="120" width="168" height="22" rx="11" fill="#c4935c" fill-opacity="0.12" stroke="#c4935c" stroke-width="0.8"/>
  <text x="164" y="135" font-family="'Inter', system-ui, sans-serif" font-size="9" fill="#c4935c" text-anchor="middle">✦  Design. Collaborate. Publish.</text>

  <!-- h1 (2 lines) -->
  <text x="80" y="186" font-family="'Inter', system-ui, sans-serif" font-size="42" fill="#e2e3e8" font-weight="800" letter-spacing="-1">Create Stunning</text>
  <text x="80" y="236" font-family="'Inter', system-ui, sans-serif" font-size="42" fill="#c4935c" font-weight="800" letter-spacing="-1">Visual Designs</text>

  <!-- Sub-heading -->
  <text x="80" y="278" font-family="'Inter', system-ui, sans-serif" font-size="16" fill="#9ca3af">ManuScript Studio gives you a professional canvas</text>
  <text x="80" y="298" font-family="'Inter', system-ui, sans-serif" font-size="16" fill="#9ca3af">to create, edit, and share designs with ease.</text>

  <!-- CTA buttons -->
  <rect x="80" y="328" width="180" height="44" rx="8" fill="#c4935c"/>
  <text x="170" y="354" font-family="'Inter', system-ui, sans-serif" font-size="14" fill="#111318" text-anchor="middle" font-weight="700">Get Started Free</text>

  <rect x="276" y="328" width="148" height="44" rx="8" fill="transparent" stroke="#2a2d38"/>
  <text x="350" y="354" font-family="'Inter', system-ui, sans-serif" font-size="14" fill="#9ca3af" text-anchor="middle">View Templates</text>

  <!-- small print -->
  <text x="80" y="398" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#4b5563">No credit card required  ·  Free tier available</text>

  <!-- Right col (canvas preview) — 640px wide, x=800 -->
  <rect x="780" y="108" width="600" height="460" rx="12" fill="#141618" stroke="#2a2d38"/>
  <!-- fake browser chrome -->
  <rect x="780" y="108" width="600" height="32" rx="12" fill="#1e2128"/>
  <rect x="780" y="128" width="600" height="12" fill="#1e2128"/>
  <circle cx="800" cy="124" r="5" fill="#2a2d38"/>
  <circle cx="816" cy="124" r="5" fill="#2a2d38"/>
  <circle cx="832" cy="124" r="5" fill="#2a2d38"/>
  <!-- app screenshot hint -->
  <rect x="790" y="148" width="580" height="408" rx="4" fill="#191c22"/>
  <!-- mini toolbar -->
  <rect x="790" y="148" width="580" height="32" fill="#111318"/>
  <text x="1080" y="168" font-family="'Courier New', monospace" font-size="8" fill="#4b5563" text-anchor="middle">Editor toolbar preview</text>
  <!-- mini canvas -->
  <rect x="840" y="192" width="480" height="340" rx="2" fill="#1a1d23"/>
  <rect x="890" y="228" width="380" height="268" rx="4" fill="#fff" opacity="0.04"/>
  <text x="1080" y="370" font-family="'Courier New', monospace" font-size="10" fill="#3a3d48" text-anchor="middle">Canvas Editor Preview</text>

  <!-- dimension annotations (hero columns) -->
  <text x="450" y="590" font-family="'Courier New', monospace" font-size="8" fill="#c4935c" text-anchor="middle">← Text column ~660px →</text>
  <text x="1080" y="590" font-family="'Courier New', monospace" font-size="8" fill="#c4935c" text-anchor="middle">← Canvas preview ~600px →</text>

  <!-- ─── FEATURES SECTION  y=600 → y=1020 ─── -->
  <rect x="0" y="600" width="1440" height="2" fill="#2a2d38"/>
  <rect x="0" y="602" width="1440" height="418" fill="#0b0d10"/>
  <text x="720" y="598" font-family="'Courier New', monospace" font-size="8" fill="#c4935c" text-anchor="middle">FEATURES SECTION  h=418px  bg=#0b0d10  3-column grid  (9 feature cards)</text>

  <text x="720" y="640" font-family="'Inter', system-ui, sans-serif" font-size="26" fill="#e2e3e8" font-weight="700" text-anchor="middle">Everything you need to design</text>
  <text x="720" y="664" font-family="'Inter', system-ui, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">A full-featured design tool with AI, layers, and collaboration</text>

  <!-- 3-col feature cards: (1440-2*64-2*24)/3 = (1440-128-48)/3 ≈ 421px wide -->
  <!-- col 1 x=64, col 2 x=64+421+24=509, col 3 x=509+421+24=954 -->
  <!-- Row 1 y=688, row 2 y=832, row 3 would go below but we have 9 ÷ 3 = 3 rows → rows at 688, 796, 904 approx -->
  <!-- let's do h=92 cards with gap=16 to fit 3 rows in 418-80 = 338px → 3*92+2*16 = 308 ✓ -->

  <!-- Row 1 -->
  <rect x="64" y="688" width="416" height="92" rx="6" fill="#141618" stroke="#2a2d38"/>
  <rect x="76" y="700" width="28" height="28" rx="6" fill="#c4935c" fill-opacity="0.12"/>
  <text x="90" y="719" font-family="'Inter', system-ui, sans-serif" font-size="14" fill="#c4935c" text-anchor="middle">✦</text>
  <text x="116" y="712" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#e2e3e8" font-weight="600">AI-Powered Design</text>
  <text x="76" y="740" font-family="'Inter', system-ui, sans-serif" font-size="10" fill="#6b7280">Describe your design goal and let AI</text>
  <text x="76" y="754" font-family="'Inter', system-ui, sans-serif" font-size="10" fill="#6b7280">generate elements, layouts, and styles.</text>
  <text x="76" y="768" font-family="'Courier New', monospace" font-size="7" fill="#4b5563">Sparkles / AI Chat panel</text>

  <rect x="512" y="688" width="416" height="92" rx="6" fill="#141618" stroke="#2a2d38"/>
  <rect x="524" y="700" width="28" height="28" rx="6" fill="#c4935c" fill-opacity="0.12"/>
  <text x="538" y="719" font-family="'Inter', system-ui, sans-serif" font-size="14" fill="#c4935c" text-anchor="middle">⊞</text>
  <text x="564" y="712" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#e2e3e8" font-weight="600">Layered Canvas</text>
  <text x="524" y="740" font-family="'Inter', system-ui, sans-serif" font-size="10" fill="#6b7280">Full Fabric.js canvas with layers panel,</text>
  <text x="524" y="754" font-family="'Inter', system-ui, sans-serif" font-size="10" fill="#6b7280">z-index controls, grouping, and locking.</text>

  <rect x="960" y="688" width="416" height="92" rx="6" fill="#141618" stroke="#2a2d38"/>
  <rect x="972" y="700" width="28" height="28" rx="6" fill="#c4935c" fill-opacity="0.12"/>
  <text x="986" y="719" font-family="'Inter', system-ui, sans-serif" font-size="14" fill="#c4935c" text-anchor="middle">↓</text>
  <text x="1012" y="712" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#e2e3e8" font-weight="600">Export Anywhere</text>
  <text x="972" y="740" font-family="'Inter', system-ui, sans-serif" font-size="10" fill="#6b7280">Download as PNG, JPG, SVG, or PDF.</text>
  <text x="972" y="754" font-family="'Inter', system-ui, sans-serif" font-size="10" fill="#6b7280">One-click export with quality settings.</text>

  <!-- Row 2 -->
  <rect x="64" y="796" width="416" height="92" rx="6" fill="#141618" stroke="#2a2d38"/>
  <rect x="524" y="796" width="28" height="28" rx="6" fill="#c4935c" fill-opacity="0.12" x="512" y="796"/>
  <rect x="76" y="808" width="28" height="28" rx="6" fill="#c4935c" fill-opacity="0.12"/>
  <text x="90" y="827" font-family="'Inter', system-ui, sans-serif" font-size="14" fill="#c4935c" text-anchor="middle">T</text>
  <text x="116" y="820" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#e2e3e8" font-weight="600">Rich Text Tools</text>
  <text x="76" y="848" font-family="'Inter', system-ui, sans-serif" font-size="10" fill="#6b7280">Google Fonts integration, font weight,</text>
  <text x="76" y="862" font-family="'Inter', system-ui, sans-serif" font-size="10" fill="#6b7280">spacing, alignment and text effects.</text>

  <rect x="512" y="796" width="416" height="92" rx="6" fill="#141618" stroke="#2a2d38"/>
  <rect x="524" y="808" width="28" height="28" rx="6" fill="#c4935c" fill-opacity="0.12"/>
  <text x="538" y="827" font-family="'Inter', system-ui, sans-serif" font-size="14" fill="#c4935c" text-anchor="middle">🖼</text>
  <text x="564" y="820" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#e2e3e8" font-weight="600">Photo Library</text>
  <text x="524" y="848" font-family="'Inter', system-ui, sans-serif" font-size="10" fill="#6b7280">Millions of free stock photos via</text>
  <text x="524" y="862" font-family="'Inter', system-ui, sans-serif" font-size="10" fill="#6b7280">integrated Unsplash / Pexels search.</text>

  <rect x="960" y="796" width="416" height="92" rx="6" fill="#141618" stroke="#2a2d38"/>
  <rect x="972" y="808" width="28" height="28" rx="6" fill="#c4935c" fill-opacity="0.12"/>
  <text x="986" y="827" font-family="'Inter', system-ui, sans-serif" font-size="14" fill="#c4935c" text-anchor="middle">⬡</text>
  <text x="1012" y="820" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#e2e3e8" font-weight="600">Brand Kit</text>
  <text x="972" y="848" font-family="'Inter', system-ui, sans-serif" font-size="10" fill="#6b7280">Store your brand colors, fonts, and</text>
  <text x="972" y="862" font-family="'Inter', system-ui, sans-serif" font-size="10" fill="#6b7280">logos for consistent designs.</text>

  <!-- Row 3 -->
  <rect x="64" y="904" width="416" height="92" rx="6" fill="#141618" stroke="#2a2d38"/>
  <rect x="76" y="916" width="28" height="28" rx="6" fill="#c4935c" fill-opacity="0.12"/>
  <text x="116" y="928" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#e2e3e8" font-weight="600">Template Library</text>
  <text x="76" y="956" font-family="'Inter', system-ui, sans-serif" font-size="10" fill="#6b7280">Hundreds of templates across 14+</text>
  <text x="76" y="970" font-family="'Inter', system-ui, sans-serif" font-size="10" fill="#6b7280">categories, AI-searchable.</text>

  <rect x="512" y="904" width="416" height="92" rx="6" fill="#141618" stroke="#2a2d38"/>
  <rect x="524" y="916" width="28" height="28" rx="6" fill="#c4935c" fill-opacity="0.12"/>
  <text x="564" y="928" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#e2e3e8" font-weight="600">Elements Library</text>
  <text x="524" y="956" font-family="'Inter', system-ui, sans-serif" font-size="10" fill="#6b7280">Shapes, icons, lines, and illustrations</text>
  <text x="524" y="970" font-family="'Inter', system-ui, sans-serif" font-size="10" fill="#6b7280">searchable from the left panel.</text>

  <rect x="960" y="904" width="416" height="92" rx="6" fill="#141618" stroke="#2a2d38"/>
  <rect x="972" y="916" width="28" height="28" rx="6" fill="#c4935c" fill-opacity="0.12"/>
  <text x="1012" y="928" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#e2e3e8" font-weight="600">Cloud Storage</text>
  <text x="972" y="956" font-family="'Inter', system-ui, sans-serif" font-size="10" fill="#6b7280">Auto-save to Neon DB with signed</text>
  <text x="972" y="970" font-family="'Inter', system-ui, sans-serif" font-size="10" fill="#6b7280">upload URLs and R2 asset storage.</text>

  <!-- ─── HOW IT WORKS  y=1020 → y=1230 ─── -->
  <rect x="0" y="1020" width="1440" height="2" fill="#2a2d38"/>
  <rect x="0" y="1022" width="1440" height="208" fill="#0d0e12"/>
  <text x="720" y="1018" font-family="'Courier New', monospace" font-size="8" fill="#c4935c" text-anchor="middle">HOW IT WORKS  h=208px  3-step horizontal layout</text>

  <text x="720" y="1056" font-family="'Inter', system-ui, sans-serif" font-size="22" fill="#e2e3e8" font-weight="700" text-anchor="middle">How it works</text>

  <!-- Step 1 -->
  <circle cx="300" cy="1112" r="24" fill="#1e2128" stroke="#c4935c" stroke-width="1.5"/>
  <text x="300" y="1118" font-family="'Inter', system-ui, sans-serif" font-size="16" fill="#c4935c" text-anchor="middle" font-weight="700">1</text>
  <text x="300" y="1156" font-family="'Inter', system-ui, sans-serif" font-size="13" fill="#e2e3e8" text-anchor="middle" font-weight="600">Choose a Template</text>
  <text x="300" y="1172" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Pick from 100+ professionally</text>
  <text x="300" y="1186" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">designed starting points.</text>

  <!-- connector arrow -->
  <line x1="460" y1="1112" x2="572" y2="1112" stroke="#2a2d38" stroke-width="1.5" stroke-dasharray="4,3"/>
  <path d="M570 1108 l5 4 l-5 4" fill="none" stroke="#2a2d38" stroke-width="1.5"/>

  <!-- Step 2 -->
  <circle cx="720" cy="1112" r="24" fill="#1e2128" stroke="#c4935c" stroke-width="1.5"/>
  <text x="720" y="1118" font-family="'Inter', system-ui, sans-serif" font-size="16" fill="#c4935c" text-anchor="middle" font-weight="700">2</text>
  <text x="720" y="1156" font-family="'Inter', system-ui, sans-serif" font-size="13" fill="#e2e3e8" text-anchor="middle" font-weight="600">Customize in the Editor</text>
  <text x="720" y="1172" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Drag, drop, and edit with AI</text>
  <text x="720" y="1186" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">assistance at every step.</text>

  <!-- connector arrow -->
  <line x1="880" y1="1112" x2="992" y2="1112" stroke="#2a2d38" stroke-width="1.5" stroke-dasharray="4,3"/>
  <path d="M990 1108 l5 4 l-5 4" fill="none" stroke="#2a2d38" stroke-width="1.5"/>

  <!-- Step 3 -->
  <circle cx="1140" cy="1112" r="24" fill="#1e2128" stroke="#c4935c" stroke-width="1.5"/>
  <text x="1140" y="1118" font-family="'Inter', system-ui, sans-serif" font-size="16" fill="#c4935c" text-anchor="middle" font-weight="700">3</text>
  <text x="1140" y="1156" font-family="'Inter', system-ui, sans-serif" font-size="13" fill="#e2e3e8" text-anchor="middle" font-weight="600">Export &amp; Share</text>
  <text x="1140" y="1172" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Download in your preferred</text>
  <text x="1140" y="1186" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">format or share via link.</text>

  <!-- ─── CTA SECTION  y=1230 → y=1340 ─── -->
  <rect x="0" y="1230" width="1440" height="2" fill="#2a2d38"/>
  <rect x="0" y="1232" width="1440" height="108" fill="#141618"/>
  <text x="720" y="1228" font-family="'Courier New', monospace" font-size="8" fill="#c4935c" text-anchor="middle">CTA SECTION  h=108px  bg=#141618</text>

  <text x="720" y="1264" font-family="'Inter', system-ui, sans-serif" font-size="22" fill="#e2e3e8" font-weight="700" text-anchor="middle">Ready to create something amazing?</text>
  <text x="720" y="1284" font-family="'Inter', system-ui, sans-serif" font-size="13" fill="#9ca3af" text-anchor="middle">Join thousands of designers using ManuScript Studio today.</text>

  <rect x="620" y="1298" width="200" height="36" rx="8" fill="#c4935c"/>
  <text x="720" y="1320" font-family="'Inter', system-ui, sans-serif" font-size="13" fill="#111318" text-anchor="middle" font-weight="700">Get Started Free →</text>

  <!-- ─── FOOTER  y=1340 ─── -->
  <rect x="0" y="1340" width="1440" height="2" fill="#2a2d38"/>
  <rect x="0" y="1342" width="1440" height="58" fill="#0b0d10"/>
  <text x="720" y="1338" font-family="'Courier New', monospace" font-size="7.5" fill="#c4935c" text-anchor="middle">SITE FOOTER  h=58px</text>
  <text x="32" y="1374" font-family="'Inter', system-ui, sans-serif" font-size="10" fill="#4b5563">© ManuScript Studio</text>
  <text x="720" y="1374" font-family="'Inter', system-ui, sans-serif" font-size="10" fill="#4b5563" text-anchor="middle">Privacy Policy  ·  Terms of Service  ·  Refund Policy  ·  Contact</text>

</svg>
