services:
  app:
    env_file:
      - ../.env
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      target: runtime
    container_name: ms-studio-app
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      API_PORT: 3010
      PORT: 3010
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3010}
    ports:
      - "${APP_PORT:-3000}:3000"
      - "${API_PORT:-3010}:3010"
    networks:
      - ms-studio-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3010/api/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  postgres_data:
    driver: local

networks:
  ms-studio-network:
    driver: bridge
