<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Outer glow for the circle -->
    <filter id="glow-ring" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Soft glow for trees -->
    <filter id="tree-glow" x="-30%" y="-20%" width="160%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Red glow filter -->
    <filter id="red-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feFlood flood-color="#cc2200" flood-opacity="0.8" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Deep red circle fill gradient -->
    <radialGradient id="circleGrad" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#4a0000"/>
      <stop offset="60%" stop-color="#1e0000"/>
      <stop offset="100%" stop-color="#0a0000"/>
    </radialGradient>
    <!-- Tree gradient (white to red-white) -->
    <linearGradient id="treeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#ffddcc"/>
      <stop offset="100%" stop-color="#ee6644"/>
    </linearGradient>
    <!-- Clip the trees to stay inside the circle -->
    <clipPath id="circleClip">
      <circle cx="512" cy="370" r="212"/>
    </clipPath>
  </defs>

  <!-- ── Black rounded background ── -->
  <rect width="1024" height="1024" rx="108" ry="108" fill="#0c0c0c"/>

  <!-- ── Subtle texture overlay ── -->
  <rect width="1024" height="1024" rx="108" ry="108" fill="url(#noise)" opacity="0.04"/>

  <!-- ── White border ── -->
  <rect x="6" y="6" width="1012" height="1012" rx="104" ry="104"
        fill="none" stroke="#ede8de" stroke-width="7" opacity="0.9"/>

  <!-- ═══════════════════════════════════════
       CIRCUIT BOARD TRACES — LEFT SIDE
  ═══════════════════════════════════════ -->
  <g fill="none" stroke="#cc2200" stroke-width="2.5" opacity="0.9">
    <!-- Main horizontal trace left -->
    <polyline points="290,310 220,310 180,270"/>
    <!-- Dot at end -->
    <circle cx="180" cy="270" r="6" fill="#cc2200" stroke="none"/>
    <circle cx="178" cy="270" r="10" fill="none" stroke="#cc2200" stroke-width="1.5" opacity="0.5"/>

    <!-- Branch 1 -->
    <polyline points="240,310 240,350 200,350"/>
    <circle cx="200" cy="350" r="6" fill="#cc2200" stroke="none"/>
    <circle cx="198" cy="350" r="10" fill="none" stroke="#cc2200" stroke-width="1.5" opacity="0.5"/>

    <!-- Upper trace -->
    <polyline points="310,260 250,260 250,220 200,220"/>
    <circle cx="200" cy="220" r="6" fill="#cc2200" stroke="none"/>
    <circle cx="198" cy="220" r="10" fill="none" stroke="#cc2200" stroke-width="1.5" opacity="0.5"/>

    <!-- Connector dot -->
    <circle cx="250" cy="260" r="5" fill="#cc2200" stroke="none"/>

    <!-- Lower trace left -->
    <polyline points="295,420 230,420 230,460 185,460"/>
    <circle cx="185" cy="460" r="6" fill="#cc2200" stroke="none"/>
    <circle cx="183" cy="460" r="10" fill="none" stroke="#cc2200" stroke-width="1.5" opacity="0.5"/>

    <!-- Small branch off lower trace -->
    <polyline points="230,460 230,500 210,500"/>
    <circle cx="210" cy="500" r="5" fill="#cc2200" stroke="none"/>
  </g>

  <!-- ═══════════════════════════════════════
       CIRCUIT BOARD TRACES — RIGHT SIDE
  ═══════════════════════════════════════ -->
  <g fill="none" stroke="#cc2200" stroke-width="2.5" opacity="0.9" transform="scale(-1,1) translate(-1024,0)">
    <polyline points="290,310 220,310 180,270"/>
    <circle cx="180" cy="270" r="6" fill="#cc2200" stroke="none"/>
    <circle cx="178" cy="270" r="10" fill="none" stroke="#cc2200" stroke-width="1.5" opacity="0.5"/>
    <polyline points="240,310 240,350 200,350"/>
    <circle cx="200" cy="350" r="6" fill="#cc2200" stroke="none"/>
    <circle cx="198" cy="350" r="10" fill="none" stroke="#cc2200" stroke-width="1.5" opacity="0.5"/>
    <polyline points="310,260 250,260 250,220 200,220"/>
    <circle cx="200" cy="220" r="6" fill="#cc2200" stroke="none"/>
    <circle cx="198" cy="220" r="10" fill="none" stroke="#cc2200" stroke-width="1.5" opacity="0.5"/>
    <circle cx="250" cy="260" r="5" fill="#cc2200" stroke="none"/>
    <polyline points="295,420 230,420 230,460 185,460"/>
    <circle cx="185" cy="460" r="6" fill="#cc2200" stroke="none"/>
    <circle cx="183" cy="460" r="10" fill="none" stroke="#cc2200" stroke-width="1.5" opacity="0.5"/>
    <polyline points="230,460 230,500 210,500"/>
    <circle cx="210" cy="500" r="5" fill="#cc2200" stroke="none"/>
  </g>

  <!-- ═══════════════════════════════════════
       CIRCLE — outer red glow halo
  ═══════════════════════════════════════ -->
  <circle cx="512" cy="370" r="222" fill="none" stroke="#ff3300" stroke-width="18" opacity="0.25" filter="url(#glow-ring)"/>
  <circle cx="512" cy="370" r="218" fill="none" stroke="#ff4400" stroke-width="6" opacity="0.4" filter="url(#glow-ring)"/>

  <!-- ── Circle fill ── -->
  <circle cx="512" cy="370" r="212" fill="url(#circleGrad)"/>

  <!-- ── Circle bright ring ── -->
  <circle cx="512" cy="370" r="212" fill="none" stroke="#ff3300" stroke-width="5" filter="url(#glow-ring)" opacity="0.95"/>
  <!-- Thin crisp ring on top -->
  <circle cx="512" cy="370" r="212" fill="none" stroke="#ff6644" stroke-width="2"/>

  <!-- ═══════════════════════════════════════
       TWO BARE OAK TREES  (clipped to circle)
  ═══════════════════════════════════════ -->
  <g clip-path="url(#circleClip)" filter="url(#tree-glow)">

    <!-- ──────── LEFT TREE (center ~x=462) ──────── -->
    <g fill="url(#treeGrad)">
      <!-- Trunk -->
      <path d="M453,578 C448,560 444,530 446,500 C448,470 452,455 456,440 C460,425 462,415 462,415
               C462,415 464,425 468,440 C472,455 476,470 478,500 C480,530 476,560 471,578 Z"/>

      <!-- Root splays -->
      <path d="M448,570 C440,575 428,578 415,574 C418,568 428,562 440,565 Z" opacity="0.8"/>
      <path d="M476,570 C484,575 494,576 504,570 C500,564 490,560 478,565 Z" opacity="0.8"/>
      <path d="M455,576 C450,585 442,592 432,592 C434,584 441,576 452,574 Z" opacity="0.7"/>

      <!-- Main left branch -->
      <path d="M454,450 C445,440 425,418 408,398 C414,394 422,393 428,397
               C436,410 448,432 456,445 Z"/>
      <!-- Sub-branch left-left -->
      <path d="M416,410 C408,400 396,388 384,382 C388,377 396,376 401,380 C408,390 416,403 420,410 Z"/>
      <!-- Twig left-left-up -->
      <path d="M392,388 C386,380 380,368 376,356 C380,354 385,355 387,360 C390,370 393,380 396,388 Z"/>
      <!-- Twig left-left-left -->
      <path d="M386,385 C378,380 368,376 358,376 C360,370 366,367 372,370 C379,374 384,380 388,386 Z"/>
      <!-- Sub-branch left-mid -->
      <path d="M428,420 C420,406 410,388 404,372 C409,369 415,370 418,375 C423,389 428,408 432,420 Z"/>

      <!-- Main right branch (curves up-right from trunk) -->
      <path d="M468,448 C476,435 492,412 508,394 C504,390 497,390 493,394
               C486,406 474,430 466,445 Z"/>
      <!-- Sub-branch right-up -->
      <path d="M500,404 C508,393 516,380 520,366 C516,363 510,364 507,369
               C503,380 500,393 498,404 Z"/>
      <!-- Twig right-up-right -->
      <path d="M518,370 C524,360 528,348 528,336 C524,335 519,337 518,343
               C517,353 517,363 516,370 Z"/>
      <!-- Twig right-up-left -->
      <path d="M512,372 C506,362 500,350 498,338 C502,336 507,338 508,344
               C510,354 511,364 513,372 Z"/>
      <!-- Sub-branch right-mid -->
      <path d="M492,408 C500,395 512,378 520,362 C516,359 510,360 507,365
               C500,379 494,396 490,408 Z"/>

      <!-- Center-up branch -->
      <path d="M460,430 C458,415 456,396 456,378 C460,376 464,376 468,378
               C468,396 466,415 464,430 Z"/>
      <!-- Center-up top branch left -->
      <path d="M456,388 C450,378 442,367 434,358 C438,354 444,354 447,359
               C452,368 455,378 458,388 Z"/>
      <!-- Center-up top branch right -->
      <path d="M468,386 C474,376 480,364 484,354 C480,350 474,351 472,357
               C469,367 468,377 466,386 Z"/>
    </g>

    <!-- ──────── RIGHT TREE (center ~x=562) ──────── -->
    <g fill="url(#treeGrad)" transform="scale(-1,1) translate(-1024,0)">
      <!-- (Mirror of left tree at x = 1024-562 = 462) -->
      <!-- Trunk -->
      <path d="M453,578 C448,560 444,530 446,500 C448,470 452,455 456,440 C460,425 462,415 462,415
               C462,415 464,425 468,440 C472,455 476,470 478,500 C480,530 476,560 471,578 Z"/>
      <path d="M448,570 C440,575 428,578 415,574 C418,568 428,562 440,565 Z" opacity="0.8"/>
      <path d="M476,570 C484,575 494,576 504,570 C500,564 490,560 478,565 Z" opacity="0.8"/>
      <path d="M455,576 C450,585 442,592 432,592 C434,584 441,576 452,574 Z" opacity="0.7"/>
      <path d="M454,450 C445,440 425,418 408,398 C414,394 422,393 428,397
               C436,410 448,432 456,445 Z"/>
      <path d="M416,410 C408,400 396,388 384,382 C388,377 396,376 401,380 C408,390 416,403 420,410 Z"/>
      <path d="M392,388 C386,380 380,368 376,356 C380,354 385,355 387,360 C390,370 393,380 396,388 Z"/>
      <path d="M386,385 C378,380 368,376 358,376 C360,370 366,367 372,370 C379,374 384,380 388,386 Z"/>
      <path d="M428,420 C420,406 410,388 404,372 C409,369 415,370 418,375 C423,389 428,408 432,420 Z"/>
      <path d="M468,448 C476,435 492,412 508,394 C504,390 497,390 493,394
               C486,406 474,430 466,445 Z"/>
      <path d="M500,404 C508,393 516,380 520,366 C516,363 510,364 507,369
               C503,380 500,393 498,404 Z"/>
      <path d="M518,370 C524,360 528,348 528,336 C524,335 519,337 518,343
               C517,353 517,363 516,370 Z"/>
      <path d="M512,372 C506,362 500,350 498,338 C502,336 507,338 508,344
               C510,354 511,364 513,372 Z"/>
      <path d="M492,408 C500,395 512,378 520,362 C516,359 510,360 507,365
               C500,379 494,396 490,408 Z"/>
      <path d="M460,430 C458,415 456,396 456,378 C460,376 464,376 468,378
               C468,396 466,415 464,430 Z"/>
      <path d="M456,388 C450,378 442,367 434,358 C438,354 444,354 447,359
               C452,368 455,378 458,388 Z"/>
      <path d="M468,386 C474,376 480,364 484,354 C480,350 474,351 472,357
               C469,367 468,377 466,386 Z"/>
    </g>

  </g>

  <!-- ═══════════════════════════════════════
       TEXT — "DED OAK"
  ═══════════════════════════════════════ -->
  <!-- Shadow / depth layer -->
  <text x="516" y="742"
        text-anchor="middle"
        fill="#330000"
        font-family="Impact, 'Arial Black', 'Franklin Gothic Heavy', sans-serif"
        font-size="148"
        font-weight="900"
        letter-spacing="14">DED OAK</text>

  <!-- Main text with subtle red inner shadow feel -->
  <text x="512" y="738"
        text-anchor="middle"
        fill="#f0ebe0"
        font-family="Impact, 'Arial Black', 'Franklin Gothic Heavy', sans-serif"
        font-size="148"
        font-weight="900"
        letter-spacing="14">DED OAK</text>

  <!-- ═══════════════════════════════════════
       TEXT — "DIGITAL HOLDINGS"
  ═══════════════════════════════════════ -->
  <text x="516" y="799"
        text-anchor="middle"
        fill="#660000"
        font-family="'Arial', 'Helvetica', sans-serif"
        font-size="52"
        font-weight="700"
        letter-spacing="14">DIGITAL HOLDINGS</text>

  <text x="512" y="796"
        text-anchor="middle"
        fill="#cc2200"
        font-family="'Arial', 'Helvetica', sans-serif"
        font-size="52"
        font-weight="700"
        letter-spacing="14">DIGITAL HOLDINGS</text>

</svg>
