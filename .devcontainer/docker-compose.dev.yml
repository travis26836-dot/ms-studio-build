# Development overrides for hot reload and debugging
services:
  app:
    build:
      target: builder
    command: pnpm dev
    environment:
      NODE_ENV: development
    volumes:
      - ../client:/app/client
      - ../server:/app/server
      - ../shared:/app/shared
      - ../prisma:/app/prisma
      - /app/node_modules
    develop:
      watch:
        - action: sync+restart
          path: ../server
          target: /app/server
          ignore:
            - node_modules/
        - action: sync
          path: ../client/src
          target: /app/client/src
